[package]
name = "capra_autonomy"
version = "0.1.0"
edition = "2021"
description = "Autonomy engine for the Capra Roboguard — reads sensors via rove_sensor_api and drives the robot (sim or real) through the same wire seams."

[[bin]]
name = "rove_autonomy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
