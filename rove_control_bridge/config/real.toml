# capra_autonomy — engine config (GoTo vertical slice).
#
# The robot surface (sim or real) lives behind rove_sensor_api. In the current
# dev topology that is think2 = 192.168.2.4 (sim-backed). Point this at the real
# robot's Jetson by changing robot_host only — the wire seams are identical.

robot_host = "192.168.2.2"
http_port  = 8080          # rove_sensor_api /discover (resolves data + command ports)

# ---------- Pose source (VectorNav VN-300 + external GNSS broadcast) -----
# On the REAL robot the VN-300 has a working IMU/AHRS but NO GNSS, so attitude
# (yaw/roll/pitch/gyro_z) comes from the VN via rove_sensor_api and POSITION comes
# from the external GNSS broadcast below (see [gnss]).
[datum]                    # local-ENU origin — set to the OPERATING SITE.
# Captured live from the :7010 broadcast on 2026-06-17 (acc ~1.3 m — good fix).
# `alt` MUST match the site ground MSL: the fall reflex trips on z = alt_msl - alt.
lat = 46.7564690
lon = 7.5941370
alt = 570.11

[telemetry]
vectornav_id   = "vectornav_ttyUSB_VN300"   # /discover id on the real robot
subscribe_ms   = 20                 # 50 Hz push
pose_stale_ms  = 500                # no fresh VN frame for this long -> stop driving

[position]                          # PositionService complementary filter
correction_gain = 0.05              # per-sample pull toward the GNSS fix (~0.4 s smoothing @50Hz)

[vn]                                # VectorNav mounting on the real robot
up_axis = "y"                       # VN is mounted on its side — gravity reads on +Y (accel_y≈+g,
                                    # raw roll≈-90° when level). Body tilt + yaw-rate derive from +Y.
gyro_yaw_sign = 1.0                 # +1/-1 so a CCW turn RAISES the fused heading. VALIDATE on the
                                    # robot: rotate CCW and confirm heading increases; flip if not.

# ---------- GNSS (external broadcast) -----------------------------------
# The on-robot `mpu5-gps-restream` service reads the MPU5 radio's gpsd and
# broadcasts a JSON fix to 255.255.255.255:port whenever it has a 3D fix. The
# bridge binds this port and fuses the fix (lat/lon/alt_msl/speed/track) with the
# VN attitude. (Sim uses source="vectornav" — the default — where the VN frame
# carries the fix in-band; that path is unchanged.)
[gnss]
source   = "broadcast"
port     = 7010
stale_ms = 1500                     # a fix older than this -> treated as no-fix

# ---------- Drive (track ODrives via rove_sensor_api) -------------------
# Port of rove_control_bridge tracks_velocity strategy.
[tracks]
left_nodes    = [31, 34]
right_nodes   = [32, 33]
invert_left   = false
invert_right  = false       # SIM models tracks logically (no physical mirror). Verified by probe:
                            # opposite L/R node signs => rotate, same sign => translate. On the REAL
                            # robot the right ODrives are mirrored -> set true there.
max_velocity  = 50.0        # rev/s at full normalized deflection — HARD CAP on the real drums
slew_per_s    = 1.5         # ramp: full-scale command change takes ~0.67 s (no track-jerk)

# ---------- Control loop + GoTo behaviour -------------------------------
[control]
rate_hz = 50.0

[goto]                      # OUTER loop (GNSS pose) — heading target + forward speed
arrive_tol_m = 1.0          # drive until within 1 m of the (GNSS-estimated) goal. NOTE: live
                            # fixes report ~10 m accuracy (eph) — 1 m is vs the FILTERED estimate,
                            # so it may hunt near the goal; the PositionFilter smoothing damps it.
k_v          = 0.35         # forward gain (per metre of remaining distance), normalized
v_max        = 0.30         # cap on normalized forward (slow -> less slip-drift while turning)
drive_offset_deg = 0.0      # 0 on the real robot: heading is the FUSED gyro+GNSS-course heading
                            # (injected via yaw_ned), which already IS the drive-forward axis.

# INNER heading asservissement (IMU gyro_z vs track differential) — mud rejection.
# turn = kp*heading_err + ki*∫err - kd*(gyro_sign*yaw_rate). ki=kd=0 => plain steer.
[asserv]
kp        = 1.2             # proportional on heading error (rad)
ki        = 0.4             # integral — holds heading against sustained slip (cambered mud)
kd        = 0.3             # gyro damping — counters slip-induced yaw the instant the IMU sees it
i_gate    = 0.20            # only integrate within ~11deg of aligned (anti-windup on turns)
i_clamp   = 0.5             # anti-windup bound on the integral term
max_turn  = 0.50            # more authority to break high-friction scrub; backed by stuck-turn
                            # detection + a reverse-pivot RECOVERY wiggle (main.rs) when a turn stalls.
gyro_sign = -1.0            # gyro_z is CW-positive on this build (verified live): -1 -> CCW-positive

# ---------- L0 reflexes (safety gate — vetoes ALL driving) --------------
# Hard bounds checked every tick before any behaviour. A trip latches an estop
# and stops the mission (deliberate reset/restart to recover). This is what keeps
# a misbehaving controller from driving the robot off the map.
[reflex]
geofence_radius_m = 200.0   # effectively off — the cost map (inflated no-go around holes/steep drops)
                            # + the sim catch-floor are the real safety now. Far backstop only.
fall_floor_m      = 10.0    # estop if height drops >this below datum, SUSTAINED ~1 s (GNSS alt is
                            # noisy ±10 m → debounced in the reflex). Coarse backstop; real edge
                            # protection is the lidar cliff reflex (being wired).
max_roll_deg      = 35.0    # SAR L0: roll > 35deg -> kill drive
max_pitch_deg     = 35.0    # SAR L0: pitch > 35deg -> kill drive

# ---------- Lidar forward-hazard reflex (perception) --------------------
# Bottom Livox (near sensing) -> stop before obstacles (trees) and ground edges
# (cliffs), regardless of pose error. This is what keeps GoTo from driving into
# things or off the map. The top Livox (5022) has a ~6 m near blind spot (its
# lowest beam is only -7deg), so near sensing uses the bottom one.
# Real Mid-360s via the livox_bridge sidecar (LVXR), bottom lidar = ground sensor.
# Heading-independent PROXIMITY reflex: stop if an obstacle or ground edge/hole is
# close in any near direction (the body heading isn't trusted yet, so no directional
# corridor / cost-map routing — that comes once heading is calibrated). Start the
# sidecar: livox_bridge/build/livox_bridge livox_bridge/config/mid360.json
[perception]
source             = "lvxr"
lvxr_pts_port      = 7020
lvxr_imu_port      = 7021
self_radius_m      = 1.0     # mask the robot's own cage (cage: 1ft front, 3ft back, 2ft sides
                            # from the lidar — circular mask at the 3ft≈0.9m max + margin)
fwd_offset_deg     = 0.0     # lidar-frame bearing of robot-FORWARD — CALIBRATE before narrowing arc
fwd_arc_deg        = 180.0   # omnidirectional (SAFE default). With the bush field behind, set ~75
                            # AFTER calibrating fwd_offset so only forward obstacles stop the robot.
obstacle_stop_m    = 2.5     # hard-stop if a solid object is within this (forward arc)
cliff_stop_m       = 2.5     # hard-stop if the ground drops away within this
require_lidar      = false   # BLIND drive: do NOT hold when there's no lidar data (no obstacle protection)
lidar_port         = 5024    # (sim LVX2 port, unused in lvxr mode)
min_ground_per_bin = 2       # (sim only)

# ---------- Mission (waypoints, ENU metres) -----------------------------
# If `relative_to_start` is true, waypoints are offsets from the first GNSS fix.
# With no explicit waypoints, `demo_forward_m` synthesises one straight ahead of
# the start heading — the safest first live drive.
[mission]
relative_to_start = true
demo_forward_m    = 0.0
# ALONG-THE-ROAD test (drive up/down the road, not across into the no-collision
# bounds). At spawn the drive-forward axis is EAST, and the road is solid to 24 m+
# East/South (raycast of the collision mesh; N/NE/NW are cliffs). 15 m East = a
# straight aligned drive with no trees in the lane. Add [15,0],[0,0] for there-and-back.
# For the obstacle-avoid demo instead: set sim env ROVE_OBSTACLES="9,0" (a trunk in
# the East lane) and keep this waypoint past it.
waypoints         = []

# ---------- Front door (operator) + rove_ik_engine ----------------------
# Front-door ports MUST stay clear of rove_sensor_api's served block (5000-5017:
# data=5000+2i, cmd=5001+2i for 9 devices) — e.g. 5005 is the gripper cmd port,
# 5007 is odrive_31's cmd port. Keep these in the 5050+ band.
[comms]
teleop_port  = 5050        # RoveControl in (Steam Deck) — was 5005 (== gripper cmd!)
mission_port = 5051        # Mission in            — was 5006 (== odrive_31 data)
estop_port   = 5052        # Estop in              — was 5007 (== odrive_31 cmd)
telemetry_out_port = 5053  # RoveTelemetry out     — was 5010 (== odrive_41 data)
engine_host  = "127.0.0.1"
engine_port  = 9100                        # arm (Ovis) UDP
engine_drive_port = 9102                   # flippers + drums (JSON) UDP
engine_http_port = 9101                    # named pose-goto relay (POST /api/v1/poses/goto)
arm_target_entity = "ent_link_07ca91a1"    # JointGripper tip; "" disables arm->engine
# All control-proto motion (RoveControl tracks + flippers + arm ovis) routes through the
# IK engine; the gripper goes straight to the robot API. The bridge never drives the drums
# for teleop. The engine's own output gates ([drives].output_enabled, [hardware].
# vel_output_enabled) decide whether a real packet reaches the robot.
