# ForgeBOT IK engine configuration.
#
# Sections:
#   [robot]     where to load the scene from
#   [ik]        solver behaviour (collision toggle, twist frame, vel caps)
#   [input]     how Ovis arrives (UDP, WebSocket, or both)
#   [output]    where StateUpdate goes (UDP, WebSocket, stdout)
#
# Paths are resolved relative to this file.

[robot]
# Tried in order. First match wins.
forgebot = "data/scene.forgebot"
urdf     = "data/robot.urdf"

[ik]
# Run python-fcl collision checks during IK; rejects steps that introduce
# new collision pairs. python-fcl is always bundled in the export, so this
# is a runtime toggle, not a build-time choice.
collision_aware = false   # TEMP: turn back on once we confirm the stutter source

# Frame Ovis position/orientation is expressed in.
#   "world"  - world axes (matches the editor gizmo's default)
#   "target" - tip's local frame (joystick-style: +x is "forward" for the tip)
twist_frame = "world"     # MUST be "world" for the bundled UI (gizmo emits world-frame deltas)

# Ovis values are normalised to [-1, 1]. These caps map 1.0 to a real
# velocity. Per-target overrides live in data/ik_profile.json.
max_lin_vel = 60.0   # metres/second at |position| = 1 (UI-tracking default)
max_ang_vel = 80.0   # radians/second at |orientation| = 1 (UI-tracking default)

# Engine tick rate. State is emitted at this rate; the latest Ovis is
# applied each tick (older Ovis messages are dropped — they're velocities,
# not a queue).
rate_hz = 60.0

# Per-tick IK trace (one line per non-idle tick at DEBUG level). With the
# engine's default log_level=INFO these lines are dropped; raise the log
# level to DEBUG for short bug-hunt sessions, never in a long-running service.
debug = false

[input]
udp_enabled = true
udp_bind    = "0.0.0.0:9100"
ws_enabled  = true
ws_bind     = "0.0.0.0:9101"
ws_path     = "/ovis"

[output]
# StateUpdate per tick. Multiple outputs can be on simultaneously.
udp_enabled    = false
udp_target     = "127.0.0.1:9200"
ws_enabled     = true              # reuses the input WS server when both on
ws_path        = "/state"
stdout_enabled = false             # length-prefixed proto frames on stdout

[hardware]
# When enabled, the engine sends a SUBSCRIBE packet to rove_sensor_api's
# kinova_arm data port at startup; sensor_api then pushes joint state back
# at subscribe_interval_ms. The UI's "Sync" button reads the latest frame
# and snaps the model to the real arm.
enabled = true
sensor_api_host = "192.168.2.2"
kinova_data_port = 5002
subscribe_interval_ms = 100

# CHAIN MODE: engine walks the kinematic tree from arm_base to arm_tip and
# assigns the joints it finds to kinova actuators 1..N (in chain order).
# Works regardless of joint names — useful when all joints share the
# default "joint_revolute" name in the editor.
arm_base_entity_id = "ent_link_1d47ab1d"   # Core (chassis — first joint above this is the kinova j1)
arm_tip_entity_id  = "ent_link_07ca91a1"   # JointGripper

# NAME MODE (alternative — used only if the two ids above are empty).
joint_names = []

# Kinova actuator indices (1..N) whose rotation axis is inverted relative
# to the model's URDF axis. After Sync the engine multiplies readings for
# these joints by -1 so model rotation direction matches the real arm.
inverted_joints = [2, 3, 4, 5, 6]

# ---- velocity output to kinova_arm ----
# SAFETY: keep `vel_output_enabled = false` until mirror direction is
# verified for every joint (drag the gizmo, watch each joint move the
# correct way). Set to true to close the loop: gizmo -> IK -> qdot -> arm.
vel_output_enabled = true    # OUTPUT ON (operator-enabled for go-home test). Requires kinova Sync first.
kinova_cmd_port = 5003
max_kinova_vel_deg_s = 40.0   # per-joint cap, deg/s
min_vel_deg_s = 0.05          # below this we send nothing (kinova auto-halts)

[drives]
# READ-ONLY mirror of the drivetrain ODrives — 4 drums (31-34) + flippers
# (41/42). The engine SUBSCRIBEs to each node's data port and reads
# `pos_estimate` (motor revolutions); the model joint = sign * (2*pi /
# gear_ratio) * pos, offset captured at /api/v1/flippers/sync. No commands sent.
#
# WORKFLOW: jog the model joint to match the real one
#   POST /api/v1/joints/set  {"joint":"FlipperFL","angle_deg":30}
# then capture the offsets for ALL nodes with a fresh frame
#   POST /api/v1/flippers/sync
# inspect live with  GET /api/v1/flippers/status
enabled = true
sensor_api_host = "192.168.2.2"
subscribe_interval_ms = 100
# Motor revs per JOINT revolution. MEASURED: the flipper drive turns 540 motor
# revs for one full flipper revolution (540:1 worm gearbox). scale = 2*pi/540
# rad per motor rev.
gear_ratio = 540.0

# ---- position OUTPUT (commanding) ----
# MASTER SAFETY GATE. true = the engine sends flipper position commands.
# Operator-enabled for the go-home test. Requires flipper Sync first (the sender
# needs the offset to map model->motor; unsynced flippers are skipped). Ports are
# resolved from /discover at startup; if discovery fails, output auto-disables.
output_enabled = true
# How fast a held +1/-1 step ramps a drive (model joint deg per second).
step_rate_deg_s = 20.0
# Each node below opts in with output=true + its served COMMAND port
# (curl http://192.168.2.2:8080/discover). Drums are normally velocity-driven
# by the control bridge; position-commanding them is mainly meaningful for
# flippers, but the capability is wired for all per request.

# Data ports are the REAL robot's served ports (curl
# http://192.168.2.2:8080/discover; the sim uses different ports).
#
# DRUMS: 31/34 = LEFT side, 32/33 = RIGHT side (the sim only maps them L/R, not
# to a specific corner). The node->corner pairing below is a best guess; swap
# the `joint` names if a wheel mirrors to the wrong corner. Drums are continuous
# wheels, so a mirrored position mostly shows the wheel spinning to match.
[[drives.node]]
node_id = 31
mode = "velocity"
max_vel_rev_s = 10.0
joint = "DrumFL"
data_port = 5006
sign = 1.0
output = false
cmd_port = 5007

[[drives.node]]
node_id = 34
mode = "velocity"
max_vel_rev_s = 10.0
joint = "DrumBL"
data_port = 5014
sign = 1.0
output = false
cmd_port = 5015

[[drives.node]]
node_id = 32
mode = "velocity"
max_vel_rev_s = 10.0
joint = "DrumFR"
data_port = 5012
sign = 1.0
output = false
cmd_port = 5013

[[drives.node]]
node_id = 33
mode = "velocity"
max_vel_rev_s = 10.0
joint = "DrumBR"
data_port = 5016
sign = 1.0
output = false
cmd_port = 5017

# FLIPPERS: only 41/42 are wired (43/44 are fried — absent from /discover).
[[drives.node]]
node_id = 41
mode = "position"
joint = "FlipperFL"
data_port = 5012   # fallback only — overridden by /discover at startup
sign = 1.0         # flip to -1.0 if the model rotates opposite the real flipper
output = true
cmd_port = 5013
min_deg = -90.0    # soft travel limits for commanded ramps
max_deg = 90.0

[[drives.node]]
node_id = 42
mode = "position"
joint = "FlipperFR"
data_port = 5016   # fallback only — overridden by /discover at startup
sign = 1.0
output = true
cmd_port = 5017
min_deg = -90.0
max_deg = 90.0
