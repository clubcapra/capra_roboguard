# ForgeBOT IK engine configuration — CAGED rover (no arm).
#
# This is the DEFAULT config the systemd service runs (scripts/install.sh ->
# run.py with no arg -> engine.toml). The arm/Kinova build lives in
# engine.standard.toml; run it explicitly with `python3 run.py engine.standard.toml`.
#
# The caged rover has the drivetrain (4 drums + flippers) and a fixed cage in
# place of the Kinova arm, so [hardware] (the arm bridge) is disabled here.
#
# Paths are resolved relative to this file.

[robot]
# No .forgebot export exists for the caged model, so the URDF is loaded. The
# forgebot path is intentionally a non-existent file: load_robot tries it first,
# misses, and falls back to the URDF below.
forgebot = "data/rove_caged.forgebot"   # absent -> falls back to urdf
urdf     = "data/rove_caged.urdf"

[ik]
# Collision-aware IK / motion ON for the caged rover (flippers vs cage/chassis).
collision_aware = true

# Frame Ovis position/orientation is expressed in.
twist_frame = "world"     # MUST be "world" for the bundled UI (gizmo emits world-frame deltas)

# Ovis velocity caps (only relevant if an arm/IK target is driven; harmless here).
max_lin_vel = 60.0
max_ang_vel = 80.0

# Engine tick rate.
rate_hz = 60.0

# Per-tick IK trace (DEBUG only). Off in the long-running service.
debug = false

[input]
udp_enabled = true
udp_bind    = "0.0.0.0:9100"
ws_enabled  = true
ws_bind     = "0.0.0.0:9101"
ws_path     = "/ovis"

[output]
udp_enabled    = false
udp_target     = "127.0.0.1:9200"
ws_enabled     = true
ws_path        = "/state"
stdout_enabled = false

[hardware]
# No Kinova arm on the caged rover — the arm bridge is disabled entirely.
enabled = false
vel_output_enabled = false

[drives]
# READ-ONLY mirror of the drivetrain ODrives — 4 drums (31-34) + flippers
# (41/42). The engine SUBSCRIBEs to each node's data port and reads
# `pos_estimate` (motor revolutions); the model joint = sign * (2*pi /
# gear_ratio) * pos, offset captured at /api/v1/flippers/sync. No commands sent
# while output_enabled = false.
#
# WORKFLOW: jog the model joint to match the real one
#   POST /api/v1/joints/set  {"joint":"FlipperFL","angle_deg":30}
# then capture the offsets for ALL nodes with a fresh frame
#   POST /api/v1/flippers/sync
# inspect live with  GET /api/v1/flippers/status
enabled = true
sensor_api_host = "192.168.2.2"
subscribe_interval_ms = 100
# Motor revs per JOINT revolution. MEASURED: 540:1 worm gearbox.
gear_ratio = 540.0

# ---- position OUTPUT (commanding) ----
# MASTER SAFETY GATE. true = the engine sends flipper/drum commands.
# ENABLED for live robot testing. Drums (velocity) drive as soon as a teleop
# packet arrives; flippers (position servo) need a Sync first — POST
# /api/v1/flippers/sync — or they're skipped (commanded-but-not-synced).
output_enabled = true
# How fast a held +1/-1 step ramps a drive (model joint deg per second).
step_rate_deg_s = 20.0

# PORTS ARE NOT CONFIGURED HERE. Every node's data/cmd port is resolved from the
# robot's GET /discover at startup (data_port/cmd_port left 0 = "ask /discover").
# There are NO fallback ports on purpose: a stale/guessed port could map to a
# DIFFERENT motor (a flipper's old fallback port was literally a drum's cmd port,
# so commanding the flipper drove a drum). The engine WAITS for /discover to come
# up before commanding, and a node /discover doesn't list is left disabled — never
# read, never commanded — until it appears.
#
# DRUMS: 31/34 = LEFT side, 32/33 = RIGHT side.
[[drives.node]]
node_id = 31
mode = "velocity"
max_vel_rev_s = 10.0
joint = "DrumFL"
data_port = 0
sign = 1.0
output = true
cmd_port = 0

[[drives.node]]
node_id = 34
mode = "velocity"
max_vel_rev_s = 10.0
joint = "DrumBL"
data_port = 0
sign = 1.0
output = true
cmd_port = 0

[[drives.node]]
node_id = 32
mode = "velocity"
max_vel_rev_s = 10.0
joint = "DrumFR"
data_port = 0
sign = -1.0        # RIGHT track inverted (right ODrives are mirror-mounted)
output = true
cmd_port = 0

[[drives.node]]
node_id = 33
mode = "velocity"
max_vel_rev_s = 10.0
joint = "DrumBR"
data_port = 0
sign = -1.0        # RIGHT track inverted (right ODrives are mirror-mounted)
output = true
cmd_port = 0

# FLIPPERS: only 41/42 are wired (43/44 are fried — absent from /discover).
# mode="position" = velocity-servo to a position target (no input_pos sent).
[[drives.node]]
node_id = 41
mode = "position"
joint = "FlipperFL"
data_port = 0
sign = -1.0
output = true
cmd_port = 0
max_vel_rev_s = 20.0  # cap on the servo's velocity command (motor rev/s)
min_deg = -90.0    # soft travel limits (clamp the target)
max_deg = 90.0

[[drives.node]]
node_id = 42
mode = "position"
joint = "FlipperFR"
data_port = 0
sign = 1.0
output = true
cmd_port = 0
max_vel_rev_s = 20.0
min_deg = -90.0
max_deg = 90.0
