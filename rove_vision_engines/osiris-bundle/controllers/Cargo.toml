[package]
name = "osiris-controller"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# OpenAPI + Scalar
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.2", features = ["axum"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Video decoding (via ffmpeg subprocess — avoids libclang build dependency)
# ffmpeg-next = "7"  # Requires libclang; use subprocess approach instead

# File watching for hot-reload
notify = "7"
notify-debouncer-mini = "0.5"

# Utilities
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
bytes = "1"
thiserror = "2"
anyhow = "1"
