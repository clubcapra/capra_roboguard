[engine]
name = "rt_detr_pose"
version = "0.1.0"
description = "RT-DETR person detection + ViTPose+ keypoint estimation (Apache 2.0)"
python_entry = "engine.py"

[model]
type = "rt-detr-pose"
weights = "huggingface"
input_size = [ 640, 640,]
device = "auto"

[inference]
confidence_threshold = 0.5
nms_threshold = 0.4
max_detections = 100

[classes]
names = [ "person",]

[tracking]
enabled = true
classes = [ "person",]
