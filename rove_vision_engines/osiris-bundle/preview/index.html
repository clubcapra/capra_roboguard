<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Osiris — Feed Preview</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --border:#262b36; --text:#e6e8ec; --muted:#8b93a1; --accent:#6366f1; --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px system-ui,sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  header .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); }
  main { display:grid; grid-template-columns:380px 1fr; gap:20px; padding:20px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .panel h2 { margin:0 0 12px; font-size:14px; font-weight:600; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], select { width:100%; padding:8px 10px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font:13px monospace; }
  .eng-list { display:flex; flex-direction:column; gap:4px; max-height:170px; overflow:auto; margin-top:4px; }
  .eng-row { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--border); border-radius:8px; font-family:monospace; font-size:12px; }
  .badge { font-size:10px; padding:1px 6px; border-radius:4px; font-family:monospace; }
  .badge.python { background:rgba(99,102,241,.15); color:#a5b4fc; }
  .badge.rust { background:rgba(245,158,11,.15); color:#fcd34d; }
  .badge.track { background:rgba(34,197,94,.15); color:#86efac; }
  .row { display:flex; align-items:center; gap:8px; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
  button.sec { background:#2a2f3a; }
  button.danger { background:#3a2329; color:#fca5a5; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { font-size:11px; color:var(--muted); margin-top:6px; }
  .feed { border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:6px; font-size:12px; }
  .feed .src { font-family:monospace; word-break:break-all; }
  .feed .meta { color:var(--muted); margin-top:3px; }
  .feed-actions { display:flex; gap:6px; margin-top:6px; }
  .viewer-wrap { position:relative; width:100%; background:#000; border-radius:10px; overflow:hidden; line-height:0; min-height:200px; }
  .viewer-wrap img { width:100%; display:block; }
  .viewer-wrap canvas { position:absolute; inset:0; width:100%; height:100%; }
  .stat { font-size:12px; color:var(--muted); margin-top:8px; }
  .err { color:var(--danger); font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header><span class="dot"></span><b>Osiris — Feed Preview</b><span id="apiInfo" class="hint" style="margin:0"></span></header>
<main>
  <div>
    <div class="panel">
      <h2>Create feed</h2>
      <label>Source</label>
      <input type="text" id="source" value="rtsp://192.168.2.4:8554/cam_front"
             placeholder="rtsp://… | /dev/video0 | webrtc://name | /path/clip.mp4">
      <label>Engines</label>
      <div id="engines" class="eng-list"><div class="hint">Loading…</div></div>
      <label>Classes to look for (optional, comma-separated)</label>
      <input type="text" id="classes" placeholder="person, knife — blank = all">
      <label class="row" style="margin-top:10px"><input type="checkbox" id="track"> Force ByteTrack on</label>
      <div class="row" style="margin-top:14px">
        <button id="createBtn" onclick="createFeed()">Create &amp; preview</button>
      </div>
      <div id="createErr" class="err"></div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Active feeds</h2>
        <button class="sec" onclick="loadFeeds()">Refresh</button>
      </div>
      <div id="feeds" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Preview</h2>
      <div class="row">
        <label style="margin:0">Overlay</label>
        <select id="overlayEngine" style="width:auto" onchange="reconnectWs()"></select>
        <label style="margin:0">conf</label>
        <input type="range" id="conf" min="0" max="100" value="30" oninput="confLbl.textContent=(this.value/100).toFixed(2)" style="width:90px">
        <span id="confLbl" class="hint" style="margin:0">0.30</span>
      </div>
    </div>
    <div class="viewer-wrap" id="viewerWrap" style="margin-top:12px">
      <img id="video" alt="">
      <canvas id="overlay"></canvas>
    </div>
    <div id="stat" class="stat">Pick or create a feed to preview.</div>
  </div>
</main>

<script>
const API_PORT = "__API_PORT__";
const API = location.protocol + "//" + location.hostname + ":" + API_PORT;
const WS  = (location.protocol === "https:" ? "wss" : "ws") + "://" + location.hostname + ":" + API_PORT;
document.getElementById("apiInfo").textContent = "API " + API;

let engines = [];
let current = null;      // {id, source, engines, width, height}
let ws = null;
let dets = [];

const COLORS = ["#ff6b6b","#51cf66","#339af0","#fcc419","#cc5de8","#20c997","#ff922b","#845ef7","#22b8cf","#f06595"];
const classColors = {}; let ci = 0;
const colorFor = c => classColors[c] || (classColors[c] = COLORS[ci++ % COLORS.length]);

async function loadEngines() {
  try {
    engines = await (await fetch(API + "/api/engines")).json();
  } catch (e) { document.getElementById("engines").innerHTML = '<div class="err">Cannot reach API at ' + API + '</div>'; return; }
  document.getElementById("engines").innerHTML = engines.map(e => `
    <label class="eng-row"><input type="checkbox" value="${e.name}">
      <span style="flex:1">${e.name}</span>
      <span class="badge ${e.runtime}">${e.runtime}</span>
      ${e.tracking ? '<span class="badge track">track</span>' : ''}
    </label>`).join("");
}

function selectedEngines() {
  return [...document.querySelectorAll('#engines input:checked')].map(c => c.value);
}

async function createFeed() {
  const source = document.getElementById("source").value.trim();
  const engs = selectedEngines();
  const classes = document.getElementById("classes").value.split(",").map(s=>s.trim()).filter(Boolean);
  const track = document.getElementById("track").checked;
  const err = document.getElementById("createErr"); err.textContent = "";
  if (!source) { err.textContent = "Source required"; return; }
  if (!engs.length) { err.textContent = "Pick at least one engine"; return; }

  const btn = document.getElementById("createBtn"); btn.disabled = true; btn.textContent = "Creating…";
  try {
    const body = { source, engines: engs };
    if (classes.length) body.classes = classes;
    if (track) body.track = true;
    const resp = await fetch(API + "/api/feeds", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const data = await resp.json();
    if (!resp.ok) { err.textContent = data.error || ("HTTP " + resp.status); return; }
    await loadFeeds();
    preview(data);
  } catch (e) { err.textContent = "Failed: " + e.message; }
  finally { btn.disabled = false; btn.textContent = "Create & preview"; }
}

async function loadFeeds() {
  let feeds = [];
  try { feeds = await (await fetch(API + "/api/feeds")).json(); } catch (e) {}
  const el = document.getElementById("feeds");
  if (!feeds.length) { el.innerHTML = '<div class="hint">No active feeds.</div>'; return; }
  el.innerHTML = feeds.map(f => `
    <div class="feed">
      <div class="src">${f.source}</div>
      <div class="meta">${f.engines.join(", ")} · ${f.width}×${f.height} · ${f.status}${f.classes ? " · ["+f.classes.join(", ")+"]" : ""}</div>
      <div class="feed-actions">
        <button onclick='preview(${JSON.stringify(f)})'>Preview</button>
        <button class="danger" onclick="stopFeed('${f.id}')">Stop</button>
      </div>
    </div>`).join("");
}

async function stopFeed(id) {
  await fetch(API + "/api/feeds/" + id, { method:"DELETE" });
  if (current && current.id === id) { closeWs(); document.getElementById("video").src = ""; clearCanvas(); current = null; document.getElementById("stat").textContent = "Feed stopped."; }
  loadFeeds();
}

function preview(feed) {
  current = feed;
  const ov = document.getElementById("overlayEngine");
  ov.innerHTML = feed.engines.map(e => `<option>${e}</option>`).join("");
  document.getElementById("video").src = "/mjpeg?src=" + encodeURIComponent(feed.source);
  const c = document.getElementById("overlay");
  c.width = feed.width || 1280; c.height = feed.height || 720;
  document.getElementById("stat").textContent = "Streaming " + feed.source;
  reconnectWs();
}

function reconnectWs() {
  closeWs();
  if (!current) return;
  const engine = document.getElementById("overlayEngine").value || current.engines[0];
  ws = new WebSocket(`${WS}/ws/${engine}/${current.id}`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.detections) { dets = m.detections; draw(); }
    document.getElementById("stat").textContent =
      `${engine} · ${dets.length} detections · ${m.inference_ms?.toFixed?.(0) ?? "?"}ms · ts ${m.timestamp_ms}`;
  };
  ws.onerror = () => { document.getElementById("stat").textContent = "WS error for " + engine; };
}

function closeWs() { if (ws) { try { ws.close(); } catch(e){} ws = null; } dets = []; }
function clearCanvas() { const c=document.getElementById("overlay"); c.getContext("2d").clearRect(0,0,c.width,c.height); }

function draw() {
  const c = document.getElementById("overlay"); const ctx = c.getContext("2d");
  ctx.clearRect(0, 0, c.width, c.height);
  const thresh = document.getElementById("conf").value / 100;
  const lw = Math.max(2, Math.round(c.width / 480));
  ctx.lineWidth = lw; ctx.font = `bold ${Math.max(13, Math.round(c.width/55))}px sans-serif`;
  for (const d of dets) {
    if (d.confidence < thresh) continue;
    const bb = d.bbox; const x = bb.x ?? bb[0], y = bb.y ?? bb[1], w = bb.width ?? bb[2], h = bb.height ?? bb[3];
    const color = colorFor(d.class);
    ctx.strokeStyle = color; ctx.strokeRect(x, y, w, h);
    const label = `${d.class}${d.track_id != null ? " #" + d.track_id : ""} ${(d.confidence*100).toFixed(0)}%`;
    const tw = ctx.measureText(label).width, fh = parseInt(ctx.font);
    ctx.fillStyle = color; ctx.fillRect(x, y - fh - 6, tw + 10, fh + 6);
    ctx.fillStyle = "#fff"; ctx.fillText(label, x + 5, y - 5);
    if (Array.isArray(d.keypoints)) {
      ctx.fillStyle = color;
      for (const kp of d.keypoints) { if ((kp[2] ?? 1) > 0.3) { ctx.beginPath(); ctx.arc(kp[0], kp[1], lw+1, 0, 7); ctx.fill(); } }
    }
  }
}

loadEngines();
loadFeeds();
setInterval(loadFeeds, 5000);
</script>
</body>
</html>
