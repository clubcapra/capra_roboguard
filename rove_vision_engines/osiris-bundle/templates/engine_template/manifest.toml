# Osiris Vision Engine Manifest
# This file is auto-generated by the training app export pipeline.
# You can also create it manually for custom engines.

[engine]
name = "{{engine_name}}"
version = "0.1.0"
description = "{{description}}"
python_entry = "engine.py"

[model]
# Model architecture: "rt-detr", "yolo", "custom"
type = "{{model_type}}"
# Path to model weights relative to this directory
weights = "{{weights_file}}"
# Input dimensions [width, height]
input_size = [640, 640]
# Device selection: "auto", "cpu", "cuda:0", "cuda:1"
device = "auto"

[inference]
confidence_threshold = 0.5
nms_threshold = 0.4
max_detections = 100

[classes]
# Inline class list
names = []
# Or load from a file (one class per line):
# file = "classes.txt"

# [tracking]
# ByteTrack layer (orchestrator-side) that assigns a stable track_id to each
# detection across frames — so a person/object can be followed over time. Travels
# with the engine into exported bundles. Uncomment and set enabled = true to use.
# enabled = true
# classes = ["person"]      # restrict tracking to these classes; omit to track all
# high_thresh = 0.5         # score for the first (high-confidence) association pass
# low_thresh = 0.1          # detections below this are ignored
# iou_high = 0.2            # min IoU to match a track in the first pass
# iou_low = 0.5             # min IoU to match a track in the second pass
# new_track_thresh = 0.6    # min score to start a brand-new track
# track_buffer = 30         # frames a lost track is kept for re-acquisition
# min_box_area = 0          # ignore boxes smaller than this
